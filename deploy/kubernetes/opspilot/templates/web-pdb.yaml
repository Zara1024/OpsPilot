{{- if and .Values.web.enabled .Values.web.podDisruptionBudget.enabled }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "opspilot.webName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "opspilot.labels" . | nindent 4 }}
    app.kubernetes.io/component: web
spec:
  minAvailable: {{ default 1 .Values.web.podDisruptionBudget.minAvailable }}
  selector:
    matchLabels:
      {{- include "opspilot.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: web
{{- end }}

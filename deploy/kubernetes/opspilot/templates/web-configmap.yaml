{{- if .Values.web.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "opspilot.webName" . }}-nginx
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "opspilot.labels" . | nindent 4 }}
    app.kubernetes.io/component: web
data:
  nginx.conf: |
    worker_processes auto;
    pid /tmp/nginx.pid;
    error_log /dev/stderr warn;

    events { worker_connections 1024; }

    http {
        include /etc/nginx/mime.types;
        default_type application/octet-stream;
        server_tokens off;
        sendfile on;
        keepalive_timeout 65;
        access_log /dev/stdout;

        client_body_temp_path /tmp/client_temp;
        proxy_temp_path /tmp/proxy_temp;
        fastcgi_temp_path /tmp/fastcgi_temp;
        uwsgi_temp_path /tmp/uwsgi_temp;
        scgi_temp_path /tmp/scgi_temp;

        gzip on;
        gzip_min_length 1024;
        gzip_proxied any;
        gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

        map $http_upgrade $connection_upgrade {
            default upgrade;
            ''      "";
        }

        upstream opspilot_backend {
            server {{ include "opspilot.managerName" . }}:{{ .Values.manager.service.port }};
            keepalive 32;
        }

        server {
            listen 8080;
            listen [::]:8080;
            server_name _;

            if ($request_uri ~* "^[^?]*(\.\.|%2e%2e)") {
                return 400;
            }

            location ~ /\.(?!well-known) {
                deny all;
                return 404;
            }

            location ~* ^/(debug/pprof|actuator|metrics_internal) {
                deny all;
                return 404;
            }

            add_header X-Content-Type-Options nosniff always;
            add_header X-Frame-Options SAMEORIGIN always;
            add_header Referrer-Policy strict-origin-when-cross-origin always;
            add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), bluetooth=()" always;
            add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: blob:; connect-src 'self' wss: ws: https:; object-src 'none'; base-uri 'self'; frame-ancestors 'self';" always;

            location = /nginx-healthz {
                default_type text/plain;
                return 200 "ok\n";
            }

            location = /healthz {
                proxy_pass http://opspilot_backend/healthz;
                proxy_set_header Host $http_host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
            }

            location = /readyz {
                proxy_pass http://opspilot_backend/readyz;
                proxy_set_header Host $http_host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
            }

            location /api/ {
                proxy_pass http://opspilot_backend;
                proxy_http_version 1.1;
                client_max_body_size 70M;
                proxy_set_header Host $http_host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
                proxy_set_header Upgrade $http_upgrade;
                proxy_set_header Connection $connection_upgrade;
                proxy_connect_timeout 10s;
                proxy_send_timeout 300s;
                proxy_read_timeout 300s;
                proxy_buffering off;
                proxy_cache off;
                chunked_transfer_encoding on;
            }

            location /r/ {
                proxy_pass http://opspilot_backend;
                proxy_http_version 1.1;
                proxy_set_header Host $http_host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
            }

            location = /internal/k8s/enroll {
                proxy_pass http://opspilot_backend/internal/k8s/enroll;
                proxy_http_version 1.1;
                proxy_set_header Host $http_host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
            }

            location = /internal/edge/enroll {
                client_max_body_size 32k;
                proxy_pass http://opspilot_backend/internal/edge/enroll;
                proxy_http_version 1.1;
                proxy_set_header Host $http_host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
                proxy_set_header Authorization $http_authorization;
            }

            location = /internal/k8s/telemetry-config {
                proxy_pass http://opspilot_backend/internal/k8s/telemetry-config;
                proxy_http_version 1.1;
                proxy_set_header Host $http_host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
                proxy_set_header Authorization $http_authorization;
            }

            location /assets/ {
                root /usr/share/nginx/html;
                expires 1y;
                access_log off;
                add_header Cache-Control "public, immutable" always;
                add_header X-Content-Type-Options nosniff always;
            }

            location / {
                root /usr/share/nginx/html;
                try_files $uri $uri/ /index.html;
                add_header Cache-Control "no-cache" always;
                add_header X-Content-Type-Options nosniff always;
                add_header X-Frame-Options SAMEORIGIN always;
                add_header Referrer-Policy strict-origin-when-cross-origin always;
                add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), bluetooth=()" always;
                add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: blob:; connect-src 'self' wss: ws: https:; object-src 'none'; base-uri 'self'; frame-ancestors 'self';" always;
            }
        }
    }
{{- end }}

{{- if .Values.manager.podDisruptionBudget.enabled }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "opspilot.managerName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "opspilot.labels" . | nindent 4 }}
    app.kubernetes.io/component: manager
spec:
  minAvailable: {{ default 1 .Values.manager.podDisruptionBudget.minAvailable }}
  selector:
    matchLabels:
      {{- include "opspilot.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: manager
{{- end }}
{{- if .Values.manager.autoscaling.enabled }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "opspilot.managerName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "opspilot.labels" . | nindent 4 }}
    app.kubernetes.io/component: manager
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "opspilot.managerName" . }}
  minReplicas: {{ default 2 .Values.manager.autoscaling.minReplicas }}
  maxReplicas: {{ default 6 .Values.manager.autoscaling.maxReplicas }}
  behavior:
    scaleDown:
      stabilizationWindowSeconds: {{ default 300 .Values.manager.autoscaling.scaleDownStabilizationWindowSeconds }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ default 75 .Values.manager.autoscaling.targetCPUUtilizationPercentage }}
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: {{ default 80 .Values.manager.autoscaling.targetMemoryUtilizationPercentage }}
{{- end }}

{{- if eq (include "opspilot.hasInlineSecret" .) "true" }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "opspilot.secretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "opspilot.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- if and (eq (default "mysql" .Values.database.dialect) "mysql") (empty .Values.database.existingSecret) (not (empty .Values.database.dsn)) }}
  db-dsn: {{ .Values.database.dsn | quote }}
  {{- end }}
  {{- if empty .Values.secrets.existingSecret }}
  {{- if not (empty .Values.secrets.jwtSecret) }}
  jwt-secret: {{ .Values.secrets.jwtSecret | quote }}
  {{- end }}
  {{- if not (empty .Values.secrets.secretKey) }}
  secret-key: {{ .Values.secrets.secretKey | quote }}
  {{- end }}
  {{- if not (empty .Values.secrets.packetParserTokenSecret) }}
  packet-parser-token-secret: {{ .Values.secrets.packetParserTokenSecret | quote }}
  {{- end }}
  {{- if not (empty .Values.secrets.adminPassword) }}
  admin-password: {{ .Values.secrets.adminPassword | quote }}
  {{- end }}
  {{- end }}
{{- end }}

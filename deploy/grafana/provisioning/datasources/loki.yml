apiVersion: 1

# Loki datasource provisioning (ADR-012). Built-in Loki defaults to the
# `loki` docker service; external Loki URL is overridden via env when
# OPSPILOT_LOG_BUILTIN=false.
datasources:
  - name: opspilot-loki
    uid: opspilot-loki
    type: loki
    access: proxy
    # Grafana env interpolation does NOT support shell-style :- defaults
    # (v0.7.40 fix). Default lives in the grafana service compose env.
    url: ${OPSPILOT_LOG_URL}
    isDefault: false
    # The manager updates this datasource after runtime Loki settings change.
    editable: true
    jsonData:
      timeout: 60
      maxLines: 5000

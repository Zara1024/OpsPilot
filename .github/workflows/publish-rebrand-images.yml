name: Publish rebrand images

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: CNB image tag to publish
        required: true
        default: v1.0.0

permissions:
  contents: read

jobs:
  manager:
    name: Publish manager image (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-24.04
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: docker.cnb.cool
          username: cnb
          password: ${{ secrets.CNB_TOKEN }}
      - name: Build and push manager image
        run: |
          set -euo pipefail
          docker buildx build \
            --platform "${{ matrix.platform }}" \
            --build-arg VERSION="${{ inputs.image_tag }}" \
            --tag "docker.cnb.cool/zara1024/opspilot:${{ inputs.image_tag }}-${{ matrix.arch }}" \
            --file deploy/Dockerfile.opspilot \
            --push .

  web:
    name: Publish web image
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: docker.cnb.cool
          username: cnb
          password: ${{ secrets.CNB_TOKEN }}
      - name: Build and push web image
        run: |
          set -euo pipefail
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --build-arg VERSION="${{ inputs.image_tag }}" \
            --tag "docker.cnb.cool/zara1024/opspilot/opspilot-web:${{ inputs.image_tag }}" \
            --file deploy/Dockerfile.web \
            --push .

  merge:
    name: Merge manager manifest
    runs-on: ubuntu-24.04
    needs: manager
    steps:
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: docker.cnb.cool
          username: cnb
          password: ${{ secrets.CNB_TOKEN }}
      - name: Create multi-architecture tag
        run: |
          set -euo pipefail
          tag="${{ inputs.image_tag }}"
          for attempt in 1 2 3; do
            if docker buildx imagetools create \
              --tag "docker.cnb.cool/zara1024/opspilot:${tag}" \
              "docker.cnb.cool/zara1024/opspilot:${tag}-amd64" \
              "docker.cnb.cool/zara1024/opspilot:${tag}-arm64"; then
              exit 0
            fi
            echo "imagetools create failed (attempt ${attempt}); retrying..." >&2
            sleep $((attempt * 5))
          done
          exit 1

name: Publish rebrand images

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: CNB image tag to publish
        required: true
        default: v1.0.0-opspilot

permissions:
  contents: read

jobs:
  manager:
    name: Publish manager image (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-24.04
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: docker.cnb.cool
          username: cnb
          password: ${{ secrets.CNB_TOKEN }}
      - name: Build and push manager image
        run: |
          set -euo pipefail
          docker buildx build \
            --platform "${{ matrix.platform }}" \
            --build-arg VERSION=1.0.0 \
            --tag "docker.cnb.cool/zara1024/opspilot:${{ inputs.image_tag }}-${{ matrix.arch }}" \
            --file deploy/Dockerfile.opspilot \
            --push .

  web:
    name: Publish web image
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: docker.cnb.cool
          username: cnb
          password: ${{ secrets.CNB_TOKEN }}
      - name: Build and push web image
        run: |
          set -euo pipefail
          docker buildx build \
            --build-arg VERSION=1.0.0 \
            --tag "docker.cnb.cool/zara1024/opspilot/opspilot-web:${{ inputs.image_tag }}" \
            --file deploy/Dockerfile.web \
            --push .

  merge:
    name: Merge manager manifest
    runs-on: ubuntu-24.04
    needs: manager
    steps:
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: docker.cnb.cool
          username: cnb
          password: ${{ secrets.CNB_TOKEN }}
      - name: Create multi-architecture tag
        run: |
          set -euo pipefail
          docker buildx imagetools create \
            --tag "docker.cnb.cool/zara1024/opspilot:${{ inputs.image_tag }}" \
            "docker.cnb.cool/zara1024/opspilot:${{ inputs.image_tag }}-amd64" \
            "docker.cnb.cool/zara1024/opspilot:${{ inputs.image_tag }}-arm64"

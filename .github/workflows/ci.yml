name: CI

# Compile + unit-test gate. Exists because regressions like a model field
# rename that left a fakeRepo test using the old API (PR #123 broke
# `go test ./internal/manager/biz/edge/...` and sat unnoticed for weeks)
# must fail a PR, not a release build. e2e tests are `//go:build e2e`
# tagged and intentionally excluded here — they need docker + a live test
# environment; this gate is the fast unit/compile layer.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: build + vet + test
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26.x'
          cache: true

      - name: Set up Buf
        uses: bufbuild/buf-action@v1
        with:
          setup_only: true

      - name: buf lint
        run: make lint-proto

      - name: go build
        run: go build ./...

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test -race ./...

      - name: Kubernetes JVM attach capabilities
        run: make test-k8s-capabilities

  web-test:
    name: web test + build
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    defaults:
      run:
        working-directory: web

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Verify commit policy
        working-directory: .
        run: make test-commit-policy

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        # Keep DOM-heavy suites from competing for CPU within their test timeouts.
        run: >-
          npm test -- --run --no-file-parallelism --testTimeout=15000
          src/api/apm.test.ts
          src/components/apm
          src/pages/Apm
          src/pages/Kubernetes.test.tsx
          src/pages/Edges.test.tsx
          src/pages/Dashboard.test.tsx
          src/pages/settings/Upgrade.test.tsx
          src/pages/settings/LLM.test.tsx
          src/pages/settings/CommunicationProviders.test.tsx
          src/components/icons/Provider.test.tsx
          src/pages/kubernetes/edgeAttachments.test.ts
          src/pages/kubernetes/registryCommands.test.ts
          src/pages/AlertIntegrations.test.tsx
          src/pages/Alerts.header.test.tsx
          src/pages/OnCallPage.test.tsx
          src/pages/oncall
          src/components/alerts/InvestigationEvidence.test.tsx

      - name: Build
        run: npm run build

  deployment-test:
    name: deployment manifests
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Helm
        uses: azure/setup-helm@v5

      - name: Check release scripts
        run: bash -n dist/package.sh dist/package-k8s-chart.sh dist/build-edge-attachments.sh deploy/install/install.sh deploy/install/upgrade.sh deploy/install/uninstall.sh deploy/install/public-url.sh deploy/install/data-permissions.sh deploy/install/apply-pending-upgrade.sh deploy/install/edge/fetch-edge-assets.sh deploy/install/edge/verify-edge-deps-archive.sh deploy/install/edge/edge-assets-lib.sh scripts/verify-cnb-compose-images.sh scripts/verify-release-images.sh scripts/publish-release-image.sh scripts/publish-release-image-platform.sh scripts/merge-release-image-manifest.sh scripts/test-publish-release-image.sh scripts/test-release-image-platform-publish.sh scripts/ensure-cnb-release.sh scripts/test-ensure-cnb-release.sh scripts/test-publish-cnb-release-attachments.sh scripts/test-verify-cnb-release-attachments.sh scripts/test-release-workflow.sh scripts/test-edge-assets.sh scripts/test-edge-assets-lib.sh scripts/test-edge-installer-connectivity-guard.sh scripts/test-edge-upgrade-hook-guard.sh scripts/test-public-url.sh scripts/test-upgrade-data-permissions.sh scripts/test-compose-release-package.sh scripts/test-apply-pending-upgrade.sh scripts/publish-helm-chart.sh scripts/test-publish-helm-chart.sh scripts/test-k8s-chart.sh

      - name: Verify Edge installer connectivity guard
        run: bash scripts/test-edge-installer-connectivity-guard.sh

      - name: Verify Compose image routing
        run: make verify-compose-images

      - name: Verify release image helpers
        run: make test-release-image-publish

      - name: Verify release workflow orchestration
        run: make test-release-workflow

      - name: Verify Helm Chart publish helper
        run: make test-publish-k8s-chart

      - name: Verify Compose-only release package
        run: make test-release-package

      - name: Lint and render Kubernetes chart
        run: make test-k8s-chart

  mysql-integration:
    name: MySQL 8.0 migrations + store tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=15

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26.x'
          cache: true

      - name: MySQL 8.0 schema migrations & store tests
        env:
          OPSPILOT_TEST_MYSQL_DSN: "root:root@tcp(127.0.0.1:3306)/?parseTime=true&charset=utf8mb4&loc=UTC"
          OPSPILOT_MCP_TEST_MYSQL_DSN: "root:root@tcp(127.0.0.1:3306)/?parseTime=true&charset=utf8mb4&loc=UTC"
        run: |
          go test -race -count=1 -v -run TestMySQLFullSchemaMigrations ./cmd/opspilot
          go test -race -count=1 \
            ./internal/manager/data/aiops/store \
            ./internal/manager/data/alert/store \
            ./internal/manager/data/device/store \
            ./internal/manager/data/k8s/store \
            ./internal/manager/data/oncall/store \
            ./internal/manager/biz/externalmcp

  security-scan:
    name: security scan (govulncheck + npm audit)
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26.x'
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Go vulnerability scan (govulncheck)
        shell: bash
        # Pin govulncheck@v1.10.0 (matching Go 1.26.x with setup-go's GOTOOLCHAIN=local)
        # and scan compiled production binaries (-mode=binary) to avoid source-mode SSA OOM and test-only noise.
        # Hard-blocking gate: any reachable vulnerability (exit code 3) or scanner error fails the job.
        run: |
          set -euo pipefail
          mkdir -p /tmp/govulncheck-bin /tmp/govulncheck-out
          GOBIN=/tmp/govulncheck-bin go install golang.org/x/vuln/cmd/govulncheck@v1.10.0
          failed=0
          {
            echo "## govulncheck (binary scan)"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

          scan_binary() {
            local name="$1"
            local path="$2"
            echo "::group::Scan $name"
            set +e
            local output
            output="$(/tmp/govulncheck-bin/govulncheck -mode=binary "$path" 2>&1)"
            local rc=$?
            set -e
            printf '%s\n' "$output"
            echo "::endgroup::"
            if [ "$rc" -eq 0 ]; then
              echo "- \`$name\`: 0 vulnerabilities" >> "$GITHUB_STEP_SUMMARY"
            elif [ "$rc" -eq 3 ]; then
              failed=1
              local summary_line
              summary_line="$(printf '%s\n' "$output" | grep -E '^Your code is affected by' | tail -n 1 || echo 'Vulnerabilities detected (see job logs)')"
              echo "::error title=govulncheck ($name)::$summary_line"
              echo "- \`$name\`: ❌ $summary_line" >> "$GITHUB_STEP_SUMMARY"
            else
              failed=1
              echo "::error title=govulncheck ($name)::govulncheck exited with unexpected code $rc"
              echo "- \`$name\`: ❌ scanner exited with code $rc" >> "$GITHUB_STEP_SUMMARY"
            fi
          }

          go build -o /tmp/govulncheck-out/opspilot ./cmd/opspilot
          scan_binary "opspilot" /tmp/govulncheck-out/opspilot

          go build -o /tmp/govulncheck-out/opspilot-edge ./cmd/opspilot-edge
          scan_binary "opspilot-edge" /tmp/govulncheck-out/opspilot-edge

          GOOS=windows GOARCH=amd64 go build -o /tmp/govulncheck-out/opspilot-edge-supervisor.exe ./cmd/opspilot-edge-supervisor
          scan_binary "opspilot-edge-supervisor (windows/amd64)" /tmp/govulncheck-out/opspilot-edge-supervisor.exe

          if [ "$failed" -ne 0 ]; then
            exit 1
          fi

      - name: Frontend dependency audit (high+)
        working-directory: web
        run: npm ci && npm audit --omit=dev --audit-level=high
